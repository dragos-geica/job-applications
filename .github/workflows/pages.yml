name: Publish Northbound and refresh research
on:
  push:
    branches: [main]
    paths-ignore: ['public-research/**']
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1'
    - cron: '0 14 * * 1'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: northbound-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Choose Monday 9 a.m. Eastern schedule (including DST)
        id: clock
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo
          run=True
          if os.environ['EVENT']=='schedule':
              hour=int(os.environ['CRON'].split()[1])
              nominal=datetime.now(timezone.utc).replace(hour=hour,minute=0)
              run=nominal.astimezone(ZoneInfo('America/New_York')).hour==9
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'run={str(run).lower()}\n')
          PY
      - uses: actions/checkout@v4
        if: steps.clock.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.clock.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        if: steps.clock.outputs.run == 'true'
        run: python -m pip install -r requirements.lock
      - name: Research and build public catalogue
        if: steps.clock.outputs.run == 'true'
        run: python export_pages.py
      - name: Save only public research history
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.name 'Northbound research bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-research/research.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public internship research'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        if: steps.clock.outputs.run == 'true'
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@v3
        if: steps.clock.outputs.run == 'true'
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        if: steps.clock.outputs.run == 'true'
        uses: actions/deploy-pages@v4
